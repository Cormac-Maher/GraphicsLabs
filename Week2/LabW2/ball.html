
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }

      canvas { 
        border: 2px solid black;
      } 

    </style>

  </head>

  <body>
    <h1>Cormac</h1>
    <canvas id="canvas-for-ball" width="1000" height="700"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");
      
       class Ball {
        constructor(x, y, yDirection, xDirection, ballRadius) 
      {
        // constructor
        this.x = x;
        this.y = y;
        this.ballRadius = ballRadius;
        this.xDirection = xDirection;
        this.yDirection = yDirection;
      }

      move(){
      // Update the location.
        this.y += this.yDirection;
        this.x += this.xDirection;

        // Ball bounces off wall
        if(this.y >= 699){
          this.yDirection *=-1;
        }
        else if (this.y <= 1){
          this.yDirection *=-1;
        }
        if(this.x >= 999){
          this.xDirection *=-1;
        }         
        else if (this.x <= 1){
          this.xDirection *=-1;
        }
      }

      draw(){
        // drawing ball
        ctx.clearRect(0, 0, 1000, 700);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.ballRadius, 0, 2 * Math.PI);
        ctx.stroke();
      }
    }

      b1 = new Ball(1, 1, 10, 10, 10);
      b2 = new Ball(10, 10, 10, 10, 10);

      // A function to repeat every time the animation loops.
      function repeatme() {
        // Draw the ball (stroked, not filled).
        ctx.clearRect(0, 0, 1000, 700);
        b1.draw();
        b2.draw();
        b1.move();
        b2.move();

        
        // drawing pacman
        ctx.beginPath();
        ctx.arc(100, 100, 50, 0.25*Math.PI, (7/4)*Math.PI);
        ctx.lineTo(100, 100);
        ctx.lineTo(136, 136);
        
        ctx.stroke();
        
        window.requestAnimationFrame(repeatme);
      }

      // Get the animation going.
      repeatme();
      


     


      
    </script>

  </body>

</html>
