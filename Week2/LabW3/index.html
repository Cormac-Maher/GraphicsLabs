<!DOCTYPE html>

<html>

<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
		canvas {
			border: 1px solid black; 
		}
    </style>

  </head>

  <body>
	<h1>Cormac Maher</h1>
    <canvas id="canvas-for-ball" width="600" height="400"></canvas>

    <script type="text/javascript">
		// Gets a handle to the element with id canvasOne.
		var canvas = document.getElementById("canvas-for-ball");
		// Get a 2D context for the canvas.
		var ctx = canvas.getContext("2d");
		// Make the fill style red.
		ctx.fillStyle = "rgb(255, 0, 0)";

		// Add a Javascript event listener to the keypress event.
		window.addEventListener("keypress", function(event) { 
			// Just log the event to the console.
			console.log(event);
		});


	class Paddle {
        constructor(x, y, width, height, moveUp, moveDown) 
      {
        // constructor
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
      }

      draw(){
        // drawing paddle
        ctx.beginPath();
        ctx.rect(this.x, this.y, this.width, this.height);
        ctx.stroke();
      }
    }
     class Ball {
        constructor(x, y, yDirection, xDirection, ballRadius) 
      {
        // constructor
    
        this.x = x;
        this.y = y;
        this.ballRadius = ballRadius;
        this.xDirection = xDirection;
        this.yDirection = yDirection;
      }

      move(){
      // Update the location.
        this.y += this.yDirection;
        this.x += this.xDirection;

        console.log("wedw");
        // Ball bounces off wall
        if(this.y >= 399){
          this.yDirection *=-1;
        }
        else if (this.y <= 1){
          this.yDirection *=-1;
        }
        if(this.x >= 599){
          this.xDirection *=-1;
        }         
        else if (this.x <= 1){
          this.xDirection *=-1;
        }
      }

        draw(){
        // drawing ball  
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.ballRadius, 0, 2 * Math.PI);
        ctx.stroke();
      }

    }

	p1 = new Paddle(1, 1, 20, 80);
    b1 = new Ball(50, 50, 3, 3, 10);

    function repeatme() {
        // Draw the ball (stroked, not filled).
		ctx.clearRect(0, 0, 600, 400); 
		b1.draw();
        b1.move();
         
        p1.draw();
	
		 
		window.requestAnimationFrame(repeatme);
    }


      repeatme();


	$(document.body).on('keydown', function(e) {
		console.log(e.which);
		switch (e.which) {
		// key code for up arrow
		case 38:
			if (p1.y > 0){
				p1.y -= 5;
			}
			break;

		// key code for down arrow
		case 40:
			if (p1.y < 320){
				p1.y += 5;
			}
			break;
			}
	})


    </script>

  </body>

</html>
