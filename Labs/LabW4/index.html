<!DOCTYPE html>

<html>

<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
		canvas {
			border: 1px solid black; 
		}
    </style>

  </head>

  <body>
	<h1>Cormac Maher</h1>
    <h2 id="player1"></h2><br>
    <h2 id="player2"></h2>
    
    <canvas id="canvas-for-ball" width="600" height="400"></canvas>

    <script type="text/javascript">
		// Gets a handle to the element with id canvasOne.
		var canvas = document.getElementById("canvas-for-ball");
		// Get a 2D context for the canvas.
		var ctx = canvas.getContext("2d");
		// Make the fill style red.
		ctx.fillStyle = "rgb(255, 0, 0)";

		// Add a Javascript event listener to the keypress event.
		window.addEventListener("keypress", function(event) { 
			// Just log the event to the console.
			console.log(event);
		});

        var scorePlayer1 = 0;
        var scorePlayer2 = 0;

	class Paddle {
        constructor(x, y, radius, moveUp, moveDown) 
     	{
			// constructor
            this.x = x;
            this.y = y;
            this.radius = radius;
     	}

      draw()
	  {
        // drawing paddle
        ctx.beginPath();
        ctx.fillStyle = "black";
        ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
      }
    }

    class Ball {
      constructor(x, y, yDirection, xDirection, ballRadius) 
      {
        // constructor
        this.x = x;
        this.y = y;
        this.ballRadius = ballRadius;
        this.xDirection = xDirection;
        this.yDirection = yDirection;
      }

      move(){
      // Update the location.
        this.y += this.yDirection;
        this.x += this.xDirection;

        console.log("wedw");
        // Ball bounces off wall
        if(this.y >= canvas.height-10){
          this.yDirection *=-1;
        }
        else if (this.y <= 10){
          this.yDirection *=-1;
        }
        if(this.x >= canvas.width-10){
          this.xDirection *=-1;
          scorePlayer2--;
        }         
        else if (this.x <= 10){
          this.xDirection *=-1;
          scorePlayer1--;
        }
      }

      draw()
      {
        var gradient = ctx.createRadialGradient(
          this.x, this.y, this.ballRadius / 10, this.x, this.y, this.ballRadius );

        gradient.addColorStop(0, "yellow");
        gradient.addColorStop(0.5, "orange");
        gradient.addColorStop(1, "red");

        // drawing ball  
        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(this.x, this.y, this.ballRadius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
      }  
    }
    p1 = new Paddle(21, 200, 20);
    p2 = new Paddle(579, 200, 20);
    b1 = new Ball(50, 50, 3, 3, 10);

    function collisionDetection(px, py, bx, by, paddelRadius, ballRadius){
        console.log();
        // if balls collide
        if(Math.sqrt(Math.pow(bx - px, 2) + Math.pow(by - py, 2)) <= (paddelRadius + ballRadius)){

            b1.xDirection *=-1;
            b1.yDirection *=-1;
  
            // increments score
            if(px == p1.x){
                scorePlayer1++;
            }
            else if(px == p2.x){
                scorePlayer2++;
            }
        }
      

    } 
        
    


    function repeatme() {
      // Draw the ball
	    ctx.clearRect(0, 0, 600, 400); 
	  	b1.draw();
        b1.move();  
        p1.draw();
    	p2.draw();

        collisionDetection(p1.x, p1.y, b1.x, b1.y, p1.radius, b1.ballRadius);
		collisionDetection(p2.x, p2.y, b1.x, b1.y, p2.radius, b1.ballRadius);

        document.getElementById("player1").textContent = "Player 1 Score: " + scorePlayer1;
        document.getElementById("player2").textContent = "Player 2 Score: " + scorePlayer2;

		window.requestAnimationFrame(repeatme);
    }


      repeatme();


	$(document.body).on('keydown', function(e) {
		console.log(e.which);
		switch (e.which) {

		// key code for up arrow
		case 38:
			if (p1.y >= 23){
				p1.y -= 5;
			}
			break;

		// key code for down arrow
		case 40:
			if (p1.y <= 375){
				p1.y += 5;
			}
			break;

      		// key code for W (paddle 2 up)
		case 87:
			if (p2.y >= 23){
				p2.y -= 5;
			}
			break;

		// key code for S (paddle 2 down)
		case 83:
			if (p2.y <= 375){
				p2.y += 5;
			}
			break;

      case 187:
		case 107:
			if (Math.abs(b1.xDirection) < 15){
				b1.xDirection *= 1.2;
				b1.yDirection *= 1.2;
			}
			break;

		// key code for - (slow the ball down)
		case 189:
		case 109:
			if (Math.abs(b1.xDirection) > 1){
				b1.xDirection /= 1.2;
				b1.yDirection /= 1.2;
			}
			break;
      
		}
	})

  	// Move paddle 1 to the y-coordinate of the mouse when it moves over the canvas.
	$(canvas).on('mousemove', function(e) {
		// Mouse y relative to the top of the canvas.
		var mouseY = e.pageY - $(canvas).offset().top;

		// Centre the paddle on the mouse.
		p1.y = mouseY;

		// Keep the paddle inside the canvas.
		if (p1.y <= 25){
			p1.y = 25;
		}
		else if (p1.y >= 375){
			p1.y = 375;
		}
	})

    </script>

  </body>

</html>
