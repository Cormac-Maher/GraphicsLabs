<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Cormac Maher</h1>

    <canvas id="canvas" width="600" height="100"></canvas>

    <script type="text/javascript">

        var canvas = document.getElementById("canvas");

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth /  window.innerHeight, 0.1, 1000);
        // Set camera position
        camera.position.set(0, 8, 25);
        camera.lookAt(0, 0, 0);

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        
        var planeY = -8;

        // This is the size of the cube and the limits the sphere has to stay inside
        var cubeSize = 20;
        var cubeHalf = cubeSize / 2;        // walls are at x = +-10 and z = +-10
        var cubeTop = planeY + cubeSize;    // the top of the cube

        class Sphere {
            constructor(radius, x, y, colour){
                this.radius = radius;
                this.x = x;
                this.y = y;
                this.colour = colour;

                // Speed of the sphere going in each direction
                this.speedX = 0.12;
                this.speedY = 0;
                this.speedZ = 0.08;
                // Gravity pulls the speed down
                this.gravity = -0.01;

            }

            draw()
            {
                var geometry = new THREE.SphereGeometry(this.radius, this.x, this.y);
                var material = new THREE.MeshLambertMaterial( { color: this.colour, wireframe: false } );
                this.sphere = new THREE.Mesh(geometry, material);
                this.sphere.castShadow = true;
                this.sphere.position.y = 8; // the sphere starts above the plain

                // Wireframe drawn on top of the solid sphere (same geometry, wireframe: true)
                var wireMaterial = new THREE.MeshLambertMaterial( { color: 0x000000, wireframe: true } );
                this.wire = new THREE.Mesh(geometry, wireMaterial);
                
                // it is slightly bigger than the solid sphere so the lines don't flicker into it
                this.wire.scale.set(1.01, 1.01, 1.01);
                this.sphere.add(this.wire);        // added to the sphere

                scene.add(this.sphere);
            }

            update()
            {
                //Code to rotate and move sphere 
                this.sphere.rotation.x += 0.01;
                this.sphere.rotation.y += 0.01;

                this.speedY += this.gravity;
                this.sphere.position.y += this.speedY;
                this.sphere.position.x += this.speedX;
                this.sphere.position.z += this.speedZ;

                // Check if the sphere has hit the floor (the plane)
                if (this.sphere.position.y - this.radius <= planeY)
                {
                    this.sphere.position.y = planeY + this.radius;
                    this.speedY = -this.speedY;
                }

                // Check if the sphere has hit the top of the cube
                if (this.sphere.position.y + this.radius >= cubeTop)
                {
                    this.sphere.position.y = cubeTop - this.radius;
                    this.speedY = -this.speedY;
                }

                // Check if the sphere has hit the left or right wall
                if (this.sphere.position.x + this.radius >= cubeHalf)
                {
                    this.sphere.position.x = cubeHalf - this.radius;
                    this.speedX = -this.speedX;
                }
                else if (this.sphere.position.x - this.radius <= -cubeHalf)
                {
                    this.sphere.position.x = -cubeHalf + this.radius;
                    this.speedX = -this.speedX;
                }

                // Check if the sphere has hit the front or back wall
                if (this.sphere.position.z + this.radius >= cubeHalf)
                {
                    this.sphere.position.z = cubeHalf - this.radius;
                    this.speedZ = -this.speedZ;
                }
                else if (this.sphere.position.z - this.radius <= -cubeHalf)
                {
                    this.sphere.position.z = -cubeHalf + this.radius;
                    this.speedZ = -this.speedZ;
                }
            }
        } 

        var s = new Sphere(3, 32, 16, 0x00ff00);
        s.draw();

        // The second sphere is maller
        var s2 = new Sphere(2, 32, 16, 0x00ff00);
        s2.draw();
        s2.sphere.position.set(-5, 2, 5);
        s2.speedX = -0.1;
        s2.speedZ = -0.12;

        // collision detection between two spheres
        function checkCollision(a, b)
        {
            // Line between the centres of the two spheres
            var normal = new THREE.Vector3().subVectors(b.sphere.position, a.sphere.position);
            var distance = normal.length();
            var minDistance = a.radius + b.radius;

            // The spheres are touching if the distance between centres is less than the 2 radis added together
            if (distance < minDistance)
            {
                normal.normalize();

                // Push the spheres apart so they don't stay stuck inside each other
                var overlap = minDistance - distance;
                a.sphere.position.addScaledVector(normal, -overlap / 2);
                b.sphere.position.addScaledVector(normal, overlap / 2);

                // How fast the spheres are moving towards each other
                var velA = new THREE.Vector3(a.speedX, a.speedY, a.speedZ);
                var velB = new THREE.Vector3(b.speedX, b.speedY, b.speedZ);
                var approachSpeed = new THREE.Vector3().subVectors(velA, velB).dot(normal);

                // Only bounce them if they are moving towards each other
                if (approachSpeed > 0)
                {
                    // Spheres swap their speed along the collision line
                    a.speedX -= approachSpeed * normal.x;
                    a.speedY -= approachSpeed * normal.y;
                    a.speedZ -= approachSpeed * normal.z;

                    b.speedX += approachSpeed * normal.x;
                    b.speedY += approachSpeed * normal.y;
                    b.speedZ += approachSpeed * normal.z;
                }
            }
        }

        // Create the plane
        var planeGeometry = new THREE.PlaneGeometry(60, 60);
        var planeMaterial = new THREE.MeshLambertMaterial( { color: 0xcccccc, side: THREE.DoubleSide } );
        var plane = new THREE.Mesh(planeGeometry, planeMaterial);
        // plane is flat
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -8;
        // adds the shadow to the plane
        plane.receiveShadow = true;
        scene.add(plane);

        // Create the slightly transparent cube
        var cubeGeometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        var cubeMaterial = new THREE.MeshLambertMaterial( { color: 0x66aaff, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false } );
        var cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        // the cube sits on the plane 
        cube.position.y = planeY + cubeHalf;
        // the cube doesnt cast a shadow
        cube.castShadow = false;
        scene.add(cube);


        camera.position.z = 25;
        var spotLight = new THREE.SpotLight(0xffffff); 
        spotLight.position.set(15, 15, 25); 
        spotLight.castShadow = true;
        scene.add(spotLight);

        var helper = new THREE.CameraHelper(spotLight.shadow.camera);
        scene.add(helper);

        var repeatMe = function () 
        {           
            
            requestAnimationFrame(repeatMe);
            s.update();
            s2.update();
            checkCollision(s, s2);
            renderer.render(scene, camera);
        };
        repeatMe();

        
    </script>
</body>

</html>
