<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Cormac Maher</h1>

    <canvas id="canvas" width="600" height="100"></canvas>

    <script type="text/javascript">

        var canvas = document.getElementById("canvas");

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth /  window.innerHeight, 0.1, 1000);
        // Set camera position

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // creates sphere and its matrial
        var geometry = new THREE.SphereGeometry(3, 32, 16);
        var material = new THREE.MeshBasicMaterial( { color: 0x00ff00, wireframe: false } );
        var sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        camera.position.z = 25;

        var repeatMe = function () 
        {
            renderer.render(scene, camera);
            requestAnimationFrame(repeatMe);
            //Code to rotate sphere 
            sphere.rotation.x += 0.01; 
            sphere.rotation.y += 0.01; 
        };
        repeatMe();

        
    </script>
</body>

</html>
