<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Cormac Maher</h1>

    <canvas id="canvas" width="600" height="100"></canvas>

    <script type="text/javascript">

        var canvas = document.getElementById("canvas");

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth /  window.innerHeight, 0.1, 1000);
        // Set camera position
        camera.position.set(0, 8, 25);
        camera.lookAt(0, 0, 0);

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // creates sphere and its matrial
 /*     var geometry = new THREE.SphereGeometry(3, 32, 16);
        var material = new THREE.MeshLambertMaterial( { color: 0x00ff00, wireframe: false } );
        
        var sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        */
        var planeY = -8;

        class Sphere {
            constructor(radius, x, y, colour){
                this.radius = radius;
                this.x = x;
                this.y = y;
                this.colour = colour;

                // Speed of the sphere going up/down (negative = falling)
                this.speedY = 0;
                // Gravity pulls the speed down a little every frame
                this.gravity = -0.01;

            }

            draw()
            {
                var geometry = new THREE.SphereGeometry(this.radius, this.x, this.y);
                var material = new THREE.MeshLambertMaterial( { color: this.colour, wireframe: false } );
                this.sphere = new THREE.Mesh(geometry, material);
                this.sphere.castShadow = true;
                this.sphere.position.y = 8; // the sphere starts above the plain
                scene.add(this.sphere);
            }

            update()
            {
                //Code to rotate and move sphere 
                this.sphere.rotation.x += 0.01;
                this.sphere.rotation.y += 0.01;

                this.speedY += this.gravity;
                this.sphere.position.y += this.speedY;

                // Check if the bottom of the sphere has hit the plane
                if (this.sphere.position.y - this.radius <= planeY)
                {
                    // Put the sphere back on top of the plane
                    this.sphere.position.y = planeY + this.radius;
                    // Reverse the speed so the sphere bounces back up
                    this.speedY = -this.speedY * 0.9;
                }
            }
        } 

        var s = new Sphere(3, 32, 16, 0x00ff00);
        s.draw();

      // Create the plane
        var planeGeometry = new THREE.PlaneGeometry(60, 60);
        var planeMaterial = new THREE.MeshLambertMaterial( { color: 0xcccccc, side: THREE.DoubleSide } );
        var plane = new THREE.Mesh(planeGeometry, planeMaterial);
        // plane is flat
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -8;
        // adds the shadow to the plane
        plane.receiveShadow = true;
        scene.add(plane);

        camera.position.z = 25;
        var spotLight = new THREE.SpotLight(0xffffff); 
        spotLight.position.set(15, 15, 25); 
        spotLight.castShadow = true;
        scene.add(spotLight);

        var helper = new THREE.CameraHelper(spotLight.shadow.camera);
        scene.add(helper);

        var repeatMe = function () 
        {           
            
            requestAnimationFrame(repeatMe);
            s.update();
            renderer.render(scene, camera);
        };
        repeatMe();

        
    </script>
</body>

</html>
